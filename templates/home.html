<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Background Shapes -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    

    <div class="container py-5">

        <!-- Header -->
        <div class="text-center mb-5">

            <h1 class="main-title">
                <i class="bi bi-mortarboard-fill"></i>
                Student Exam Performance Predictor
            </h1>

            <p class="subtitle">
                Predict Mathematics Score using Machine Learning
            </p>

        </div>

        <!-- Card -->
        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="glass-card">

                    <h3 class="mb-4 text-center">
                        <i class="bi bi-bar-chart-fill"></i>
                        Prediction Form
                    </h3>

                    <form action="{{ url_for('predict_datapoint') }}" method="POST">

                        <div class="row">

                            <!-- Gender -->

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    <i class="bi bi-person-fill"></i>
                                    Gender
                                </label>

                                <select class="form-select" name="gender" required>

                                    <option selected disabled>Select Gender</option>

                                    <option value="male">Male</option>

                                    <option value="female">Female</option>

                                </select>

                            </div>

                            <!-- Ethnicity -->

                            <div class="col-md-6 mb-4">

                                <label class="form-label">

                                    <i class="bi bi-globe"></i>

                                    Race / Ethnicity

                                </label>

                                <select class="form-select" name="ethnicity" required>

                                    <option selected disabled>Select Group</option>

                                    <option value="group A">Group A</option>

                                    <option value="group B">Group B</option>

                                    <option value="group C">Group C</option>

                                    <option value="group D">Group D</option>

                                    <option value="group E">Group E</option>

                                </select>

                            </div>

                            <!-- Parent Education -->

                            <div class="col-md-6 mb-4">

                                <label class="form-label">

                                    <i class="bi bi-book-fill"></i>

                                    Parent Education

                                </label>

                                <select class="form-select"
                                    name="parental_level_of_education"
                                    required>

                                    <option selected disabled>Select Education</option>

                                    <option value="associate's degree">Associate's Degree</option>

                                    <option value="bachelor's degree">Bachelor's Degree</option>

                                    <option value="high school">High School</option>

                                    <option value="master's degree">Master's Degree</option>

                                    <option value="some college">Some College</option>

                                    <option value="some high school">Some High School</option>

                                </select>

                            </div>

                            <!-- Lunch -->

                            <div class="col-md-6 mb-4">

                                <label class="form-label">

                                    <i class="bi bi-cup-hot-fill"></i>

                                    Lunch Type

                                </label>

                                <select class="form-select"
                                    name="lunch"
                                    required>

                                    <option selected disabled>Select Lunch</option>

                                    <option value="standard">Standard</option>

                                    <option value="free/reduced">Free / Reduced</option>

                                </select>

                            </div>

                            <!-- Test Preparation -->

                            <div class="col-md-6 mb-4">

                                <label class="form-label">

                                    <i class="bi bi-journal-check"></i>

                                    Test Preparation

                                </label>

                                <select class="form-select"
                                    name="test_preparation_course"
                                    required>

                                    <option selected disabled>Select Course</option>

                                    <option value="completed">Completed</option>

                                    <option value="none">None</option>

                                </select>

                            </div>

                            <!-- Reading Score -->

                            <div class="col-md-6 mb-4">

                                <label class="form-label">

                                    <i class="bi bi-book-half"></i>

                                    Reading Score

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    name="reading_score"
                                    placeholder="0 - 100"
                                    min="0"
                                    max="100"
                                    required>

                            </div>

                            <!-- Writing Score -->

                            <div class="col-md-12 mb-4">

                                <label class="form-label">

                                    <i class="bi bi-pencil-square"></i>

                                    Writing Score

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    name="writing_score"
                                    placeholder="0 - 100"
                                    min="0"
                                    max="100"
                                    required>

                            </div>

                        </div>

                        <div class="d-grid">

                            <button class="btn predict-btn">

                                <i class="bi bi-stars"></i>

                                Predict Maths Score

                            </button>

                        </div>

                    </form>

                    {% if results %}

                    <div class="prediction-box mt-5">

                        <h4>

                            <i class="bi bi-trophy-fill"></i>

                            Predicted Maths Score

                        </h4>

                        <h1>{{ results }}</h1>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</body>

</html>
